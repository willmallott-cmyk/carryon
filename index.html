<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),now=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CATS=['Tops','Knitwear','Jackets & Coats','Dresses & Skirts','Trousers & Shorts','Smart & Evening','Swimwear & Beachwear','Activewear','Nightwear','Underwear & Socks','Hats & Accessories','Footwear','Toiletries','Health & Meds','Electronics','Bags','Other','Wish List'];
const EM={'Tops':'👕','Knitwear':'🧶','Jackets & Coats':'🧥','Dresses & Skirts':'👗','Trousers & Shorts':'👖','Smart & Evening':'👔','Swimwear & Beachwear':'👙','Activewear':'🩳','Nightwear':'🌙','Underwear & Socks':'🧦','Hats & Accessories':'👒','Footwear':'👟','Toiletries':'🧴','Health & Meds':'💊','Electronics':'🔌','Bags':'🧳','Other':'📦','Wish List':'⭐'};
const WORN=['Tops','Knitwear','Jackets & Coats','Dresses & Skirts','Trousers & Shorts','Smart & Evening','Swimwear & Beachwear','Activewear','Nightwear','Underwear & Socks','Hats & Accessories','Footwear'];
const slug=c=>c.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),bySlug=s=>CATS.find(c=>slug(c)==s);
const norm=s=>String(s).toLowerCase().replace(/[^a-z]/g,'').replace(/s$/,'');
const CMAP=Object.fromEntries(CATS.map(c=>[norm(c),c]));[['top,tshirt,shirt,blouse','Tops'],['jumper,sweater,cardigan,hoodie,fleece','Knitwear'],['jacket,coat,raincoat','Jackets & Coats'],['dress,skirt','Dresses & Skirts'],['trouser,short,jeans,bottom,legwear','Trousers & Shorts'],['smart,evening,formal','Smart & Evening'],['swimwear,beachwear,swim','Swimwear & Beachwear'],['gym,sportswear','Activewear'],['pyjama,sleepwear,nightwear','Nightwear'],['underwear,sock,socks','Underwear & Socks'],['hat,accessory,accessories,hatsandaccessories','Hats & Accessories'],['shoe,shoes','Footwear'],['toiletry,toiletries,washbag','Toiletries'],['health,medication,medicine,meds,firstaid','Health & Meds'],['bag,luggage,suitcase','Bags']].forEach(([k,v])=>k.split(',').forEach(x=>CMAP[norm(x)]=v));
const OLDCAT={};
function guess(t){t=String(t).toLowerCase();const h=r=>r.test(t);
return h(/toothpaste|toothbrush|shampoo|conditioner|shower|deodorant|razor|soap|face ?wash|moistur|sunscreen|suncream|spf|perfume|cologne|mascara|make-?up|lipstick|floss|hairbrush|comb|tampon|contact lens|wash ?bag|toiletr/)?'Toiletries'
:h(/plaster|paracetamol|ibuprofen|medic|antihistamine|first aid|prescription|inhaler|repellent|rehydrat/)?'Health & Meds'
:h(/swim|bikini|trunks|sarong|beach|rash ?vest/)?'Swimwear & Beachwear'
:h(/pyjama|pajama|nightie|nightdress|dressing gown|robe/)?'Nightwear'
:h(/activewear|gym|yoga|running|sports|athletic|legging/)?'Activewear'
:h(/underwear|boxers?|briefs?|knickers?|\bbras?\b|socks?|tights/)?'Underwear & Socks'
:h(/dress|skirt|jumpsuit|playsuit/)?'Dresses & Skirts'
:h(/jacket|coat|parka|blazer|gilet|puffer|anorak|windbreaker/)?'Jackets & Coats'
:h(/jumper|sweater|cardigan|hoodie|fleece|knit|sweatshirt/)?'Knitwear'
:h(/\bsuit\b|\btie\b|evening|gown|formal/)?'Smart & Evening'
:h(/trouser|jeans|shorts|chinos|joggers|\bpants\b/)?'Trousers & Shorts'
:h(/t-?shirt|\btee\b|shirt|blouse|\btop\b|vest|polo|tank/)?'Tops'
:h(/\bhat\b|\bcap\b|beanie|sunglass|scarf|glove|belt|watch|jewel|bandana|umbrella/)?'Hats & Accessories'
:h(/shoe|boot|sandal|flip-?flop|trainer|slipper|heels?/)?'Footwear'
:h(/phone|charger|power ?bank|adapter|battery|cable|camera|earbud|headphone|speaker|kindle|ipad|laptop/)?'Electronics'
:h(/suitcase|luggage|backpack|rucksack|holdall|duffle|tote|\bbag\b/)?'Bags':'Other'}

/* ---------- storage layer (swap this for a cloud store later) ---------- */
const Store={K:'carryon.v1',OLD:'carryon.v0',
load(){let d=null;try{d=JSON.parse(localStorage.getItem(this.K))}catch(e){}if(d&&d.v==2){let ch=0;(d.inventory||[]).forEach(i=>{if(OLDCAT[i.category]){i.category=OLDCAT[i.category];ch=1}});if(ch)this.save(d);return d}
try{const o=JSON.parse(localStorage.getItem(this.OLD));if(o)return this.migrate(o)}catch(e){}
return{v:2,inventory:[],trips:[],settings:{terms:'',termsDate:''}}},
migrate(o){const t=now();const d={v:2,inventory:(o.gear||[]).map(g=>({id:g.id,model:g.name,brand:'',category:guess(g.name),g:g.g||null,created_at:t,updated_at:t})),trips:(o.trips||[]),settings:{terms:o.terms||'',termsDate:o.termsDate||''}};localStorage.setItem(this.K,JSON.stringify(d));return d},
save(d){localStorage.setItem(this.K,JSON.stringify(d))}};
let S=Store.load();const save=()=>Store.save(S);
const nm=i=>((i.brand?i.brand+' ':'')+i.model).trim();

/* ---------- icons: illustrated images in /icons ---------- */
const HAS={m:['activewear', 'footwear', 'hats-and-accessories', 'health-and-meds', 'jackets-and-coats', 'knitwear', 'nightwear', 'smart-and-evening', 'swimwear-and-beachwear', 'toiletries', 'tops', 'trousers-and-shorts', 'underwear-and-socks'],f:['activewear', 'dresses-and-skirts', 'footwear', 'hats-and-accessories', 'health-and-meds', 'jackets-and-coats', 'knitwear', 'nightwear', 'smart-and-evening', 'swimwear-and-beachwear', 'toiletries', 'tops', 'underwear-and-socks']};
const svg=c=>{const k=slug(c),st=S.settings.style=='f'?'f':'m',src=HAS[st].includes(k)?st+'-'+k:k=='trousers-and-shorts'?'m-'+k:null;return src?`<img src="icons/${src}.webp" alt="" decoding="async">`:`<span class="em">${EM[c]}</span>`};
const vis=c=>!(c=='Dresses & Skirts'&&S.settings.style!='f'&&!cnt(S.inventory.filter(i=>i.category==c)));

/* ---------- trips: assign gear to duffle / backpack ---------- */
const kg=g=>(g||0)/1000,fmt=n=>n.toFixed(1)+' kg';
const FT='<p class="ft">Suggestions only. Always check your airline and airport baggage rules, and do not rely on this app for travel or safety decisions. Your data is stored only in this browser on this device; it is not backed up or synced.</p>';
const T=id=>S.trips.find(t=>t.id==id);
const ENVS=['Beach','City break','Ski','Cruise','Countryside','Road trip','Business','Festival','Camping','Other'];
const BN={d:'Hold bag',p:'Carry on',w:'Small bag'};
const asg=t=>{t.as=t.as||{};t.pk=t.pk||[];for(const k of Object.keys(t.as)){let v=t.as[k];const g=S.inventory.find(x=>x.id==k);if(!g){delete t.as[k];continue}
if(typeof v=='string'){if(!'dpw'.includes(v)||!v){delete t.as[k];continue}t.as[k]={[v]:qn(g)};t.pk=t.pk.map(x=>x==k?k+':'+v:x);v=t.as[k]}
if(typeof v!='object'||!v){delete t.as[k];continue}for(const c of ['d','p','w'])if(!(v[c]>0))delete v[c];if(!Object.keys(v).length)delete t.as[k]}return t.as};
const qn=g=>Math.max(1,parseInt(g.qty)||1),cnt=l=>l.reduce((s,g)=>s+qn(g),0),iw=g=>kg(g.g)*qn(g);const bagRows=(t,c)=>S.inventory.filter(g=>((asg(t)[g.id]||{})[c]||0)>0).map(g=>({g,n:t.as[g.id][c]})),bcnt=r=>r.reduce((s,x)=>s+x.n,0),wt=(t,c)=>bagRows(t,c).reduce((s,x)=>s+kg(x.g.g)*x.n,0),left=(t,g)=>qn(g)-Object.values((asg(t)[g.id])||{}).reduce((a,b)=>a+b,0),re=()=>{const y=scrollY;view();scrollTo(0,y)};
let bag='d',cur=null,tm='assign',IMP=null;
const fd=(a,b)=>{if(!a)return'';const f=(d,y)=>new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:y?'numeric':undefined}),A=new Date(a+'T12:00'),B=b&&new Date(b+'T12:00');
if(!b||b==a)return f(a,1);if(A.getMonth()==B.getMonth()&&A.getFullYear()==B.getFullYear())return A.getDate()+'–'+f(b,1);return f(a)+' – '+f(b,1)};

/* ---------- views ---------- */
const go=h=>location.hash=h;

if(S.settings.terms!=TERMS)return terms();
const tab=x=>['wall','cat','item','add'].includes(p)?x=='g':['trips','trip','new','edit','kit'].includes(p)?x=='t':x=='s';
$('#tabs').innerHTML=`<a href="#/wall" class="${tab('g')?'on':''}">Wardrobe</a><a href="#/trips" class="${tab('t')?'on':''}">Trips</a><a href="#/settings" class="${tab('s')?'on':''}">Settings</a>`;
$('#app').className=p=='wall'?'wide':'';
let html='';
if(p=='wall')html=wallV();else if(p=='cat')html=catV(h[1]);else if(p=='item')html=itemV(h[1]);else if(p=='add')html=itemV(null,h[1]);else if(p=='settings')html=setV();else if(p=='import'){IMP=null;html=impV()}
else if(p=='trips')html=tripsV();else if(p=='new')html=newV();else if(p=='edit')html=newV(T(h[1]));else if(p=='trip'){cur=h[1];html=tripV()}else if(p=='kit'){cur=h[1];html=kitV()}else html=wallV();
$('#app').innerHTML=html;window.scrollTo(0,0)}
function terms(){$('#tabs').innerHTML='';$('#app').innerHTML=`<h1 style="justify-content:center;margin-top:24px">Before you start</h1><div class="c">${[['Suggestions, not instructions','Packing lists, weights and allowance totals are suggestions to help you plan. They can be incomplete or wrong.'],['Not travel advice','Do not rely on this app for travel, customs, health or safety decisions.'],['Check the real rules','Always confirm baggage allowances, size limits, liquids rules and restricted items with your airline, airport and destination.'],['The decisions are yours','You are responsible for what you pack and carry. We take no liability for fees, delays, loss or damage arising from using the app.']].map(x=>`<div class="r"><div><b>${x[0]}</b><div class="s" style="font-size:14px">${x[1]}</div></div></div>`).join('')}</div>
<label class="r c" style="margin-top:12px;gap:12px"><input type="checkbox" style="width:22px;margin:0" onchange="$('#go').disabled=!this.checked"><span>I've read and understand this, and I accept the full terms.</span></label>

function wallV(){const n=c=>cnt(S.inventory.filter(i=>i.category==c));
return `<h1>Wardrobe<button class="p" data-a="go" data-h="/add">${PLUS}Add item</button></h1><div class="s">${cnt(S.inventory.filter(i=>i.category!='Wish List'))} ${cnt(S.inventory.filter(i=>i.category!='Wish List'))==1?'item':'items'} owned</div>

(S.inventory.length?'':`<div class="empty"><b>Your Wardrobe is empty</b><p>Import a CSV of what you own, or add items one at a time.</p><button class="p" data-a="go" data-h="/import">Import CSV</button> <button data-a="go" data-h="/add">Add one item</button></div>`)+FT}
function catV(s){const c=bySlug(s);if(!c)return wallV();const l=S.inventory.filter(i=>i.category==c).sort((a,b)=>nm(a).localeCompare(nm(b)));
return `<a class="back" href="#/wall">‹ Wardrobe</a><h1><span style="gap:12px"><span class="ci" style="width:48px;height:48px;border-radius:50%;overflow:hidden">${svg(c)}</span>${c}</span><button class="p" data-a="go" data-h="/add/${s}">${PLUS}Add</button></h1>`+
(l.length?`<div class="c">${l.map(i=>`<div class="r" data-a="go" data-h="/item/${i.id}" style="cursor:pointer"><div><div class="s">${esc(i.brand)||'No brand'}</div><b style="font-weight:600">${esc(i.model)}</b>${qn(i)>1?` <span class="s">×${qn(i)}</span>`:''}<div class="s">${i.category}</div></div><span class="s">${i.g?fmt(kg(i.g))+(qn(i)>1?' each':''):''}</span><span class="s">›</span></div>`).join('')}</div>`:`<div class="empty"><b>Nothing in ${c} yet</b><p>Add an item or import a CSV.</p></div>`)+FT}

dup(d){const i=S.inventory.find(x=>x.id==d.id);if(!i)return;const c={...i,id:uid(),created_at:now(),updated_at:now()};S.inventory.push(c);save();go('/item/'+c.id)},
delg(d){if(confirm('Delete this item?')){const i=S.inventory.find(g=>g.id==d.id);S.inventory=S.inventory.filter(g=>g.id!=d.id);save();go('/cat/'+slug(i.category))}},
doimp(){if(IMP.replace&&!confirm('This deletes your '+S.inventory.length+' current items and replaces them with the import. Continue?'))return;const t=now();if(IMP.replace)S.inventory=[];IMP.rows.filter(r=>!r.err.length&&r.cat&&r.cat!='-').forEach(r=>S.inventory.push({id:uid(),model:r.model,brand:r.brand,category:r.cat,g:r.w||0,qty:r.qty||1,created_at:t,updated_at:t}));save();IMP=null;go('/wall');view()},
mk(d){const n=$('#n').value.trim();if(!n){alert('Give the trip a name');return}const t=d.id?T(d.id):{id:uid(),as:{},pk:[],created_at:now()};Object.assign(t,{name:n,dest:$('#dst').value.trim(),env:$('#env').value,start:$('#sd').value,end:$('#ed').value,updated_at:now()});if(!d.id)S.trips.unshift(t);save();go('/trip/'+t.id)},
as(d){const t=T(cur),m=asg(t),g=S.inventory.find(x=>x.id==d.id);if(!g)return;const had=m[d.id]&&m[d.id][d.b];t.pk=t.pk.filter(x=>x.split(':')[0]!=d.id);if(had)delete m[d.id];else m[d.id]={[d.b]:1};save();re()},
adj(d){const t=T(cur),m=asg(t),g=S.inventory.find(x=>x.id==d.id);if(!g)return;const v=m[d.id]=m[d.id]||{},used=Object.values(v).reduce((a,b)=>a+b,0),n=v[d.b]||0,dl=+d.dl;if(dl>0&&used>=qn(g))return;const nn=Math.max(0,n+dl);if(nn)v[d.b]=nn;else{delete v[d.b];t.pk=t.pk.filter(x=>x!=d.id+':'+d.b)}if(!Object.keys(v).length)delete m[d.id];save();re()},
tk(d){const t=T(cur),i=t.pk.indexOf(d.id);i<0?t.pk.push(d.id):t.pk.splice(i,1);save();const y=scrollY;view();scrollTo(0,y)},
delt(d){if(confirm('Delete this trip?')){S.trips=S.trips.filter(t=>t.id!=d.id);save();go('/trips')}},
bk(){const j=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert('Backup copied')).catch(()=>{$('#rs').value=j;$('#rs').select();alert('Copy the text in the box')})},
rest(){doRestore($('#rs').value)},
dl(){const j=JSON.stringify(S,null,1),fn='carryon-backup-'+new Date().toISOString().slice(0,10)+'.json',b=new Blob([j],{type:'application/json'}),f=new File([b],fn,{type:'application/json'});
if(/iPhone|iPad/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove()}}};
function doRestore(txt){try{let o=JSON.parse(txt);if(o.gear&&!o.inventory)o=Store.migrate(o);if(!o.inventory||!o.trips)throw 0;if(confirm('Replace everything on this device with the backup?')){S=o;S.v=2;S.settings=S.settings||{terms:'',termsDate:''};S.inventory.forEach(i=>{if(OLDCAT[i.category])i.category=OLDCAT[i.category]});save();view()}}catch(e){alert('That doesn\'t look like a backup')}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset)}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='rf'&&t.files[0]){t.files[0].text().then(doRestore)}
else if(t.id=='f'&&t.files[0]){t.files[0].text().then(x=>{startImp(x);$('#app').innerHTML=impR()})}
else if(t.id=='rp'){IMP.replace=t.checked}
else if(t.dataset.lim){const tr=T(cur);if(tr){tr[{d:'maxKg',p:'maxKgP',w:'maxKgW'}[t.dataset.lim]]=+t.value;save();re()}}
else if(t.dataset.ch!==undefined){IMP.rows[+t.dataset.ch].cat=t.value||null;const y=scrollY;$('#app').innerHTML=impR();scrollTo(0,y)}});
addEventListener('hashchange',view);view();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
